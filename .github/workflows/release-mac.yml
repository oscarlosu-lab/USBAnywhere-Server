name: Release macOS Server Universal Binary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'server-mac-*'

permissions:
  contents: read

jobs:
  build-and-release-mac:
    name: Build Native macOS Universal Binary & Attach to Release
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile Native Swift Server Daemon & GUI (Release)
        run: |
          cd src/USBAnywhere.Server.Mac
          swift build -c release
          swift test

      - name: Package Universal Binary & Tarball
        run: |
          cd src/USBAnywhere.Server.Mac
          mkdir -p ../../dist
          cp .build/release/usbanywhere-server-mac ../../dist/
          cd ../../dist
          chmod +x usbanywhere-server-mac
          tar -czvf "USBAnywhere-Server-macOS-${{ github.ref_name }}.tar.gz" usbanywhere-server-mac
          zip -9 "USBAnywhere-Server-macOS-${{ github.ref_name }}.zip" usbanywhere-server-mac
          shasum -a 256 usbanywhere-server-mac "USBAnywhere-Server-macOS-${{ github.ref_name }}.tar.gz" "USBAnywhere-Server-macOS-${{ github.ref_name }}.zip" > SHA256SUMS-macOS.txt

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: USBAnywhere-Server-macOS-${{ github.ref_name }}
          path: dist/*

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          gh release upload "${RELEASE_TAG}" dist/* --clobber || gh release create "${RELEASE_TAG}" dist/* --title "USBAnywhere Server ${RELEASE_TAG}" --notes "Official macOS release binary (Universal Apple Silicon & Intel)." || true
